name: 问题反馈
description: 功能出错、显示异常，或结果和预期不符
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈！请按下面各项填写，**附上截图**最能帮助定位问题。

        一个 issue 只写一个问题。提交前请先升级到[最新版本](https://github.com/mxlapan/zotero-prism/releases)，并搜索一下有没有相同的 issue。

  - type: dropdown
    id: module
    attributes:
      label: 涉及的功能
      options:
        - 全文翻译（阅读器内）
        - 划词翻译 / 双语对照笔记 / 标题摘要翻译
        - AI 浮窗 / 阅读器侧边栏 / 划词问答
        - AI 笔记 / AI 标注 / 语义检索
        - 网页联动（浏览器扩展）
        - 文库可视化（自定义列 / 关系图谱 / 标注管理）
        - 阅读管理（阅读节律 / 标注复习 / 新文追踪等）
        - 安装 / 更新 / 设置
        - 其他 / 不确定
    validations:
      required: true

  - type: textarea
    id: what-happened
    attributes:
      label: 遇到了什么问题
      description: 在哪个界面、做了什么、看到了什么。请具体描述，不要只写一句“不好用”或“看不到”。
      placeholder: 例：全文翻译完成后，在译文上拖动鼠标选择文字，页面上没有任何选中的高亮，看不出选中了哪些内容。
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 别人照着做就能看到同样的问题。只在某篇文献上出现时，请写明是哪篇（标题或 DOI），或附上 PDF。
      placeholder: |
        1. 在阅读器中打开一篇 PDF
        2. 点击工具栏的棱镜按钮，选择「全文翻译」
        3. 翻译完成后，在译文上拖选一段文字
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 期望的结果
      placeholder: 例：能看到选中的高亮，复制出来的是译文。
    validations:
      required: true

  - type: textarea
    id: screenshots
    attributes:
      label: 截图或录屏
      description: 把图片或视频直接拖进这个框即可。界面上的问题请务必附图。

  - type: input
    id: prism-version
    attributes:
      label: 插件版本
      description: 「工具 → 插件」中 Zotero Prism 的版本号
      placeholder: 例：1.0.4
    validations:
      required: true

  - type: input
    id: zotero-version
    attributes:
      label: Zotero 版本
      description: 「帮助 → 关于 Zotero」；macOS 为「Zotero → 关于 Zotero」
      placeholder: 例：7.0
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: 操作系统
      options:
        - Windows
        - macOS
        - Linux
    validations:
      required: true

  - type: textarea
    id: settings
    attributes:
      label: 相关设置
      description: 与问题有关时填写，例如翻译引擎和目标语言、AI 服务商和模型、阅读器主题、是否使用代理。**请勿填写 API 密钥。**
      placeholder: 例：翻译引擎 Google，目标语言简体中文，未使用代理

  - type: textarea
    id: log
    attributes:
      label: 调试日志
      description: |
        出现报错，或点了没有反应时，请附上调试日志：
        1. 「帮助 → 调试日志 → 启用」
        2. 重新操作一遍，让问题再出现一次
        3. 「帮助 → 调试日志 → 查看输出日志」，复制其中带 `[Prism]` 的行，粘贴到这里

        粘贴前请检查一遍，删去不想公开的文献标题、文件路径等内容。
      render: text

  - type: checkboxes
    id: checks
    attributes:
      label: 提交前确认
      options:
        - label: 已升级到最新版本，问题仍然存在
          required: true
        - label: 已搜索过现有 issue，没有相同的问题
          required: true
